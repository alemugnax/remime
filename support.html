<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Supporto Remime – Contact Reminder</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      line-height: 1.6;
      color: #333;
      max-width: 620px;
      margin: 40px auto;
      padding: 0 20px;
      background: #f9f9f9;
    }
    .container {
      background: white;
      padding: 40px 32px;
      border-radius: 16px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.09);
      border: 1px solid #eee;
    }
    h1 {
      color: #1a73e8;
      font-size: 1.9em;
      margin: 0 0 28px 0;
    }
    p {
      margin: 18px 0;
      font-size: 1.07em;
    }
    .email {
      display: inline-block;
      background: #f1f5f9;
      color: #475569;
      font-size: 0.92em;           /* ← molto più piccolo */
      padding: 4px 10px;           /* meno imbottitura */
      border-radius: 6px;
      font-family: 'Courier New', Courier, monospace;
      font-weight: 500;
      margin: 16px 0;
      letter-spacing: 0.4px;
      border: 1px solid #e2e8f0;
    }
    .thanks {
      margin-top: 40px;
      padding-top: 24px;
      border-top: 1px solid #eee;
      font-style: italic;
      color: #444;
      font-size: 1.05em;
    }
    .signature {
      margin-top: 28px;
      font-weight: 600;
      color: #222;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Benvenuto nel supporto di Remime – Contact Reminder!</h1>
    
    <p>Per qualsiasi domanda, bug o suggerimento,<br>
       scrivimi pure con fiducia a:</p>
    
    <p class="email">alessio.mugnaioni@outlook.com</p>
    
    <p class="thanks">
      Grazie per utilizzare l’app!
    </p>
    
    <p class="signature">
      Alessio Mugnaioni
    </p>
  </div>

</body>
</html>
